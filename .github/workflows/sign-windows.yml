# Заглушка для подписи Windows билдов. Не запускается автоматически —
# вручную через workflow_dispatch и только когда у вас есть сертификат.
#
# Чтобы включить:
#   1. Получите сертификат Authenticode (например, через Azure Trusted Signing
#      или SSL.com EV / SignPath / Sectigo).
#   2. Добавьте секрет CODESIGN_PFX (base64 от .pfx) и CODESIGN_PASSWORD.
#   3. Снимите комментарий со step `Sign EXE` и закомментируйте step "Stub".
name: Code-sign (Windows)

on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build artefact
        run: >
          dotnet publish src/Launcher/Launcher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o publish/win-x64

      - name: Stub (no certificate configured)
        run: echo "TODO Configure CODESIGN_PFX + CODESIGN_PASSWORD secrets to enable signing."

