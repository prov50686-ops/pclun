name: package-msi

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  msi:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish src/Launcher/Launcher.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix
          wix --version

      - name: Build MSI
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          if (-not $ver) { $ver = '0.4.0' }
          $wxs = @"
          <Wix xmlns='http://wixtoolset.org/schemas/v4/wxs'>
            <Package Name='PcLun' Manufacturer='MrDomik' Version='$ver' UpgradeCode='4f4d51c0-7e91-4c8a-9d3f-9b1f3f9b8c00'>
              <MajorUpgrade DowngradeErrorMessage='A newer version of [ProductName] is already installed.' />
              <Feature Id='Main'>
                <File Source='publish\win-x64\PcLun.exe' />
              </Feature>
            </Package>
          </Wix>
          "@
          $wxs | Out-File -Encoding UTF8 pclun.wxs
          wix build pclun.wxs -o "publish\PcLun-$ver.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: publish/*.msi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*.msi
