repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format (verify)
        language: system
        entry: bash -c 'dotnet format PcLun.sln --verify-no-changes --severity warn'
        pass_filenames: false
        files: '\.(cs|axaml|xaml|sln|csproj)$'
        require_serial: true
